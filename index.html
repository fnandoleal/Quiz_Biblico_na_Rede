    </div>

</div>

<script>

function salvarNome(){

    const nomeJogador =

        document
        .getElementById(
            "nomeJogador"
        )
        .value
        .trim();

    if(!nomeJogador){

        alert(
            "Digite seu nome."
        );

        return;
    }

    localStorage.setItem(
        "nomeJogador",
        nomeJogador
    );

    alert(
        `Bem-vindo, ${nomeJogador}!`
    );

}

function ativarEnter(
    idCampo,
    funcao
){

    const campo =

        document
        .getElementById(
            idCampo
        );

    if(!campo) return;

    campo.addEventListener(

        "keydown",

        (evento) => {

            if(
                evento.key
                === "Enter"
            ){

                evento.preventDefault();

                funcao();

            }

        }

    );

}

document.addEventListener(

    "DOMContentLoaded",

    () => {

        document.getElementById(
            "nomeJogador"
        )?.focus();

        ativarEnter(
            "nomeJogador",
            salvarNome
        );

        setTimeout(() => {

            if(
                typeof enviarMensagem
                === "function"
            ){

                ativarEnter(
                    "campoMensagem",
                    enviarMensagem
                );

            }

        }, 500);

    }

);

</script>
