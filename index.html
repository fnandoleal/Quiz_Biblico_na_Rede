<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bíblico na Rede</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4efe2;
        }

        .container-principal{
            margin-top:20px;
        }

        .chat{
            height:300px;
            overflow-y:auto;
            border:1px solid #ccc;
            padding:10px;
            background:white;
        }

        .pergunta{
            min-height:120px;
        }
    </style>
</head>
<body>

<div class="container container-principal">

    <h1 class="text-center">
        📖 Quiz Bíblico na Rede
    </h1>

    <div class="row mt-4">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body">

                    <h4 id="contador">
                        Pergunta 1 de 20
                    </h4>

                    <div class="progress mb-3">
                        <div
                            id="barra"
                            class="progress-bar"
                            style="width:0%">
                        </div>
                    </div>

                    <h3 id="tempo">
                        ⏱️ 20
                    </h3>

                    <div class="pergunta">
                        <h4 id="pergunta">
                            Aguardando início...
                        </h4>
                    </div>

                    <div id="respostas"></div>

                    <button
                        class="btn btn-success mt-3"
                        id="btnResponder">
                        Responder
                    </button>

                    <div
                        id="feedback"
                        class="mt-3">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body">

                    <h4>
                        💬 Chat
                    </h4>

                    <div
                        id="chat"
                        class="chat">
                    </div>

                    <input
                        type="text"
                        id="mensagem"
                        class="form-control mt-3"
                        placeholder="Digite sua mensagem">

                    <button
                        class="btn btn-primary mt-2"
                        id="btnEnviar">
                        Enviar
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
