<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bíblico na Rede</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container container-principal">

    <h1 class="text-center">
        📖 Quiz Bíblico na Rede
    </h1>

    <div class="card p-3 mb-3">

        <h4>Entrar</h4>

        <input
            type="text"
            id="nomeJogador"
            class="form-control"
            placeholder="Digite seu nome">

        <button
            class="btn btn-success mt-2"
            onclick="salvarNome()">
            Entrar
        </button>

    </div>

    <div class="row mt-4">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body">

                    <h4 id="contador">
                        Pergunta 1 de 20
                    </h4>

                    <div class="progress mb-3">
                        <div
                            id="barra"
                            class="progress-bar"
                            style="width:0%">
                        </div>
                    </div>

                    <h3 id="tempo">
                        ⏱️ 20
                    </h3>

                    <div class="pergunta">
                        <h4 id="pergunta">
                            Em breve...
                        </h4>
                    </div>

                    <div id="respostas"></div>

                    <button
                        class="btn btn-success mt-3"
                        id="btnResponder">
                        Responder
                    </button>

                    <div
                        id="feedback"
                        class="mt-3">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body">

                    <h4>
                        💬 Chat
                    </h4>

                    <div
                        id="chat"
                        class="chat">
                    </div>

                    <input
                        type="text"
                        id="mensagem"
                        class="form-control mt-3"
                        placeholder="Digite sua mensagem">

                    <button
                        class="btn btn-primary mt-2"
                        onclick="enviarMensagem()">
                        Enviar
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
function salvarNome(){
    const nome =
        document.getElementById("nomeJogador").value;

    localStorage.setItem(
        "nomeJogador",
        nome
    );

    alert("Nome salvo!");
}
</script>

<script type="module" src="js/chat.js"></script>
<script src="js/quiz.js"></script>

</body>
</html>
</body>
</html>
